<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客 - Emerald Glaze</title>
    
    <!-- Tailwind CSS 用于快速布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 外部Javascript脚本 -->
    <script src="src/homepage/blog_config.js"></script>
    <script src="src/pub/divided_into_pages.js"></script>
    
    <!-- 字体 -->
    <link href="src/Google-Inter.ttf" rel="stylesheet">
    
    <!-- 外部CSS -->
    <link href="src/pub/style.css" rel="stylesheet">
    <link href="src/pub/Anon.ico" rel="icon" type="image/x-icon">
    
    <!-- Lucide Icons 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
</head>
    <body>        
        <div class="bg-parallax-image"></div>
        <div class="bg-parallax-gradient"></div>

        <div class="blob w-64 h-64 bg-emerald-300 top-10 left-10"></div>
        <div class="blob w-96 h-96 bg-green-200 bottom-10 right-10" style="animation-delay: -5s;"></div>

        <!--顶部导航栏-->
        <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-2xl">
        <div class="glass-panel rounded-2xl px-6 py-3 flex justify-between items-center">
            <h1 class="font-bold text-xl tracking-tight text-emerald-800" id="site-logo">BLOG.</h1>
            <div class="flex gap-1 md:gap-4">
                <button onclick="showView('home')" class="nav-link px-3 py-1.5 rounded-lg transition-all hover:bg-white/40 text-sm font-medium">首页</button>
                <button onclick="showView('articles')" class="nav-link px-3 py-1.5 rounded-lg transition-all hover:bg-white/40 text-sm font-medium">文章</button>
                <button onclick="showView('about')" class="nav-link px-3 py-1.5 rounded-lg transition-all hover:bg-white/40 text-sm font-medium">关于</button>
            </div>
        </div>
        </nav>

        <!--加载动画与动态加载区域-->
        <main class="pt-32 pb-20 px-6 max-w-4xl mx-auto">
        <!-- 首页视图 -->
        <section id="home" class="view-content active">
            <div class="text-center mb-16">
                <div class="relative inline-block mb-6">
                    <img id="profile-pic" src="https://placehold.co/150x150/d1fae5/065f46?text=Avatar" class="w-32 h-32 rounded-full border-4 border-white shadow-xl mx-auto object-cover" alt="Avatar">
                    <span class="absolute bottom-2 right-2 w-6 h-6 bg-emerald-500 border-4 border-white rounded-full"></span>
                </div>
                <h2 id="profile-name" class="text-4xl font-extrabold mb-4 text-emerald-900">你好，我是 <span class="text-emerald-600">加载中...</span></h2>
                <p id="profile-bio" class="text-lg text-emerald-700/80 max-w-xl mx-auto leading-relaxed">
                    加载个人简介中...
                </p>
                
                <div class="mt-8 flex justify-center gap-4" id="social-links">
                    <!-- 动态加载社交链接 -->
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6" id="featured-posts">
                <!-- 动态加载精选文章 -->
            </div>
            
        </section>

        <!-- 文章列表视图 -->
        <section id="articles" class="view-content">
            <h3 class="text-3xl font-bold mb-8 flex items-center gap-2">
                <img alt="A Book" src="src/pub/book-open.svg" class="text-emerald-600"> 全部文章
            </h3>
            <div class="flex flex-col gap-4" id="all-articles-list">
                <!-- 动态加载全部文章 -->
            </div>
            <div id="pagination" class="flex justify-center mt-10">
                <!--加载分页器-->
            </div>
        </section>

        <!-- 关于视图 -->
        <section id="about" class="view-content">
            <div class="glass-panel rounded-3xl p-8 md:p-12">
                <h3 class="text-3xl font-bold mb-6">关于我</h3>
                <div class="prose text-emerald-800/80 leading-loose space-y-4" id="about-content">
                    <!-- 动态加载关于内容 -->
                </div>
            </div>
        </section>
        </main>

        <!--声明-->
        <footer class="text-center py-10 text-emerald-600/60 text-sm">
        <p>© <span id="year"></span> <span id="footer-name"></span>. Built with 💚 & Acrylic Style.</p>
        </footer>
    
        <!--初始化函数与动态加载函数-->
        <script>
            // 全局变量
            let allpage = [];       // 分页后的二维数组
            let totalPages = 0;     // 总页数
            let currentPage = 1;    // 当前页码

            // 渲染指定页的文章列表
            function renderList(pageNo) {
                const container = document.getElementById('all-articles-list');
                if (!container) return;
                container.innerHTML = '';   // 清空

                const pageData = allpage[pageNo - 1];
                if (!pageData) return;

                pageData.forEach(post => {
                    container.innerHTML += `
                        <a href="${post.link}">
                            <div class="glass-panel p-4 rounded-2xl hover:bg-white/60 transition-all cursor-pointer flex justify-between items-center">
                                <div>
                                    <h4 class="font-semibold text-emerald-900">${post.title}</h4>
                                    <p class="text-xs text-emerald-600/60">${post.date} · <b class="text-emerald-600 uppercase">${post.category}</b></p>
                                </div>
                                <img alt="->" src="src/pub/arrow-right.svg" class="w-5 h-5">
                            </div>
                        </a>
                    `;
                });
            }

            // 渲染分页器
            function renderPagination(pg, total) {
                const container = document.getElementById('pagination');
                if (!container) return;

                const { strPgNum, PgNum, Now } = pg;
                const hasPrev = Now > 1;
                const hasNext = Now < total;

                let html = '<ul class="pagination">';
                // 上一页
                html += `<li><a ${hasPrev ? `onclick="changePage(${Now - 1})"` : 'class="disabled"'} href="javascript:void(0)">‹</a></li>`;

                for (let i = 0; i < strPgNum.length; i++) {
                    const num = PgNum[i];
                    const label = strPgNum[i];
                    if (num === -1 || label === '...') {
                        html += `<li><span class="disabled">…</span></li>`;
                    } else {
                        const isActive = (num === Now);
                        html += `<li><a ${isActive ? 'class="active"' : `onclick="changePage(${num})"`} href="javascript:void(0)">${label}</a></li>`;
                    }
                }

                // 下一页
                html += `<li><a ${hasNext ? `onclick="changePage(${Now + 1})"` : 'class="disabled"'} href="javascript:void(0)">›</a></li>`;
                html += '</ul>';
                container.innerHTML = html;
            }

            // 切换页面（文章列表）
            function changePage(pageNo) {
                if (pageNo < 1 || pageNo > totalPages) return;
                currentPage = pageNo;
                renderList(currentPage);
                const pg = generatePageList(allpage, currentPage);
                renderPagination(pg, totalPages);
                // 确保视图切换到文章页
                showView('articles', false); // 第二个参数表示不清空列表
            }

            // 初始化博客内容（头像、简介等）
            function initBlog() {
                document.title = `${BLOG_CONFIG.name} 的个人主页`;
                document.getElementById('profile-name').innerHTML = `你好，我是 <span class="text-emerald-600">${BLOG_CONFIG.name}</span>`;
                document.getElementById('profile-bio').innerText = BLOG_CONFIG.bio;
                document.getElementById('profile-pic').src = BLOG_CONFIG.avatar;
                document.getElementById('footer-name').innerText = BLOG_CONFIG.name;
                document.getElementById('year').innerText = new Date().getFullYear();
                document.getElementById('about-content').innerHTML = BLOG_CONFIG.aboutLong;

                // 社交链接
                const socialContainer = document.getElementById('social-links');
                socialContainer.innerHTML = '';
                BLOG_CONFIG.social.forEach(item => {
                    const link = document.createElement('a');
                    link.href = item.url;
                    link.className = "w-12 h-12 glass-panel rounded-full flex items-center justify-center hover:bg-emerald-500 hover:text-white transition-all hover-lift";
                    link.innerHTML = `<img alt="${item.plarform}" src="${item.icon}" class="w-5 h-5">`;
                    socialContainer.appendChild(link);
                });

                // 精选文章
                const featuredContainer = document.getElementById('featured-posts');
                featuredContainer.innerHTML = '';
                BLOG_CONFIG.articles.forEach(post => {
                    if (post.selected) {
                        featuredContainer.innerHTML += `
                            <a href="${post.link}">
                                <div class="glass-panel p-6 rounded-3xl hover-lift cursor-pointer group">
                                    <h4 class="text-xl font-bold mt-2 mb-3 group-hover:text-emerald-600 transition-colors">${post.title}</h4>
                                    <p class="text-emerald-800/60 text-sm mb-4">${post.excerpt}</p>
                                    <div class="flex justify-between items-center text-xs text-emerald-800/40 font-medium">
                                        <span>${post.date}</span> <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest">${post.category}</span>
                                    </div>
                                </div>
                            </a>
                        `;
                    }
                });

                lucide.createIcons();
            }

            // 视图切换
            function showView(viewId, keepList = false) {
                const views = document.querySelectorAll('.view-content');
                views.forEach(v => {
                    v.classList.remove('active');
                    setTimeout(() => {
                        if (!v.classList.contains('active')) v.style.display = 'none';
                    }, 500);
                });

                const target = document.getElementById(viewId);
                target.style.display = 'block';
                setTimeout(() => target.classList.add('active'), 50);

                // 如果切换到文章视图且需要刷新列表（首次或强制刷新）
                if (viewId === 'articles' && !keepList) {
                    renderList(currentPage);
                    const pg = generatePageList(allpage, currentPage);
                    renderPagination(pg, totalPages);
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // 页面启动
            window.onload = () => {
                // 分页数据初始化
                const divided = divide(BLOG_CONFIG.articles, 15);
                allpage = divided.pages;
                totalPages = divided.totalPages;
                currentPage = 1;

                // 初始化博客内容
                initBlog();

                // 预生成第一页的分页对象，但不在首页显示分页器
                // 首次显示首页
                showView('home');
            };
            //  视差滚动
            window.addEventListener('scroll', () => {
                // 使用 requestAnimationFrame 优化滚动时的渲染性能
                window.requestAnimationFrame(() => {
                    // 获取当前滚动距离和文档总高度
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    
                    // 计算当前滚动的百分比 (0 到 1 之间)，避免切换短页面时报错
                    const scrollPercent = docHeight > 0 ? Math.min(scrollTop / docHeight, 1) : 0;
                    
                    const bgImage = document.querySelector('.bg-parallax-image');
                    const bgGradient = document.querySelector('.bg-parallax-gradient');
                    
                    if (bgImage && bgGradient) {
                        // 参数设定：分别设置它们滑动到底部时最大的上移像素
                        // maxImgOffset: 图片最大向上移动 20vh
                        const maxImgOffset = window.innerHeight * 0.2; 
                        
                        // maxGradOffset: 渐变层最大向上移动 50vh (位移更大，体现出移动速度比图片快)
                        const maxGradOffset = window.innerHeight * 0.5;
                        
                        // 应用位移效果 (向上移动所以用负值)
                        bgImage.style.transform = `translateY(-${scrollPercent * maxImgOffset}px)`;
                        bgGradient.style.transform = `translateY(-${scrollPercent * maxGradOffset}px)`;
                    }
                });
                }
            );
        </script>
    </body>
</html>
