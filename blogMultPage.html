<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客 - Emerald Glaze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-green: #10b981;
            --accent-green: #34d399;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #f0fdf4 100%);
            background-attachment: fixed;
            color: #064e3b;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2); }
        .blob { position: fixed; z-index: -1; filter: blur(60px); opacity: 0.4; border-radius: 50%; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }
    </style>
</head>
<body>
    <div class="blob w-64 h-64 bg-emerald-300 top-10 left-10"></div>
    <div class="blob w-96 h-96 bg-green-200 bottom-10 right-10"></div>

    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-2xl">
        <div class="glass-panel rounded-2xl px-6 py-3 flex justify-between items-center">
            <a href="index.html" class="font-bold text-xl tracking-tight text-emerald-800">BLOG.</a>
            <div class="flex gap-4">
                <a href="index.html" class="px-3 py-1.5 rounded-lg hover:bg-white/40 text-sm font-medium">首页</a>
                <a href="#articles" class="px-3 py-1.5 rounded-lg hover:bg-white/40 text-sm font-medium">文章</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-4xl mx-auto">
        <section class="text-center mb-16">
            <img src="https://placehold.co/300x300/10b981/ffffff?text=Green" alt="Avatar" class="w-32 h-32 rounded-full border-4 border-white shadow-xl mx-auto object-cover mb-6">
            <h2 class="text-4xl font-extrabold mb-4 text-emerald-900">你好，我是 <span class="text-emerald-600">林小绿</span></h2>
            <p class="text-lg text-emerald-700/80 max-w-xl mx-auto">开发者与摄影爱好者。在这里分享关于技术与生活的点滴。</p>
        </section>

        <h3 id="articles" class="text-xl font-bold mb-8 text-emerald-800/60 uppercase tracking-widest text-center">文章列表</h3>
        
        <div class="grid md:grid-cols-2 gap-6">
            <!-- 文章卡片：指向具体的 HTML 文件 -->
            <a href="posts/acrylic-web.html" class="glass-panel p-6 rounded-3xl hover-lift group block">
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest">技术</span>
                <h4 class="text-xl font-bold mt-2 mb-3 group-hover:text-emerald-600">如何构建亚克力风格网页</h4>
                <p class="text-emerald-800/60 text-sm mb-4">探索 CSS Backdrop-filter 的奥秘...</p>
                <div class="flex justify-between items-center text-xs text-emerald-800/40">
                    <span>2024-05-10</span>
                    <span class="flex items-center gap-1">阅读全文 <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
                </div>
            </a>

            <a href="posts/forest-breath.html" class="glass-panel p-6 rounded-3xl hover-lift group block">
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest">摄影</span>
                <h4 class="text-xl font-bold mt-2 mb-3 group-hover:text-emerald-600">在清晨捕捉森林的呼吸</h4>
                <p class="text-emerald-800/60 text-sm mb-4">五月的镜头里，满是新绿的味道...</p>
                <div class="flex justify-between items-center text-xs text-emerald-800/40">
                    <span>2024-05-01</span>
                    <span class="flex items-center gap-1">阅读全文 <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
                </div>
            </a>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
