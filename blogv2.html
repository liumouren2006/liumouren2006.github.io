<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客 - Emerald Glaze</title>
    <!-- Tailwind CSS 用于快速布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary-green: #10b981;
            --accent-green: #34d399;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #f0fdf4 100%);
            background-attachment: fixed;
            color: #064e3b;
            overflow-x: hidden;
        }

        /* 亚克力效果基础类 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        /* 页面切换动画 */
        .view-content {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px);
            display: none;
        }

        .view-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 鼠标悬停动画 */
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);
        }

        /* 文章内排版微调 */
        .article-body p { margin-bottom: 1.5rem; line-height: 1.8; }
        .article-body h2 { font-size: 1.5rem; font-weight: bold; margin: 2rem 0 1rem; color: #065f46; }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-green); border-radius: 10px; }

        /* 装饰背景圆球 */
        .blob { position: fixed; z-index: -1; filter: blur(60px); opacity: 0.4; border-radius: 50%; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }
    </style>
</head>
<body>
    <div class="blob w-64 h-64 bg-emerald-300 top-10 left-10"></div>
    <div class="blob w-96 h-96 bg-green-200 bottom-10 right-10" style="animation-delay: -5s;"></div>

    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-2xl">
        <div class="glass-panel rounded-2xl px-6 py-3 flex justify-between items-center">
            <h1 class="font-bold text-xl tracking-tight text-emerald-800 cursor-pointer" onclick="showView('home')">BLOG.</h1>
            <div class="flex gap-1 md:gap-4">
                <button onclick="showView('home')" class="nav-link px-3 py-1.5 rounded-lg transition-all hover:bg-white/40 text-sm font-medium">首页</button>
                <button onclick="showView('articles')" class="nav-link px-3 py-1.5 rounded-lg transition-all hover:bg-white/40 text-sm font-medium">文章列表</button>
                <button onclick="showView('about')" class="nav-link px-3 py-1.5 rounded-lg transition-all hover:bg-white/40 text-sm font-medium">关于</button>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-4xl mx-auto">
        
        <!-- 首页视图 -->
        <section id="home" class="view-content active">
            <div class="text-center mb-16">
                <div class="relative inline-block mb-6">
                    <img id="profile-pic" src="" class="w-32 h-32 rounded-full border-4 border-white shadow-xl mx-auto object-cover" alt="Avatar">
                    <span class="absolute bottom-2 right-2 w-6 h-6 bg-emerald-500 border-4 border-white rounded-full"></span>
                </div>
                <h2 id="profile-name" class="text-4xl font-extrabold mb-4 text-emerald-900">你好，我是 <span class="text-emerald-600">加载中...</span></h2>
                <p id="profile-bio" class="text-lg text-emerald-700/80 max-w-xl mx-auto leading-relaxed">加载中...</p>
                <div class="mt-8 flex justify-center gap-4" id="social-links"></div>
            </div>

            <h3 class="text-xl font-bold mb-6 text-emerald-800/60 uppercase tracking-widest text-center">精选推送</h3>
            <div class="grid md:grid-cols-2 gap-6" id="featured-posts"></div>
        </section>

        <!-- 文章列表视图 -->
        <section id="articles" class="view-content">
            <h3 class="text-3xl font-bold mb-8 flex items-center gap-2">
                <i data-lucide="book-open" class="text-emerald-600"></i> 全部文章
            </h3>
            <div class="space-y-4" id="all-articles-list"></div>
        </section>

        <!-- 文章详情视图 (新) -->
        <section id="article-detail" class="view-content">
            <button onclick="showView('articles')" class="mb-8 flex items-center gap-2 text-emerald-600 font-medium hover:translate-x-[-4px] transition-transform">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回列表
            </button>
            <div class="glass-panel rounded-3xl p-8 md:p-12 overflow-hidden">
                <div id="post-header" class="mb-10 pb-8 border-b border-emerald-100">
                    <div id="post-meta" class="text-sm font-bold text-emerald-500 mb-2 uppercase tracking-widest"></div>
                    <h2 id="post-title" class="text-4xl font-extrabold text-emerald-900 mb-4 leading-tight"></h2>
                    <div id="post-date" class="text-emerald-800/40 text-sm"></div>
                </div>
                <article id="post-content" class="article-body text-emerald-800/80 prose prose-emerald max-w-none">
                    <!-- 正文内容 -->
                </article>
            </div>
        </section>

        <!-- 关于视图 -->
        <section id="about" class="view-content">
            <div class="glass-panel rounded-3xl p-8 md:p-12">
                <h3 class="text-3xl font-bold mb-6">关于我</h3>
                <div class="prose text-emerald-800/80 leading-loose space-y-4" id="about-content"></div>
            </div>
        </section>
    </main>

    <footer class="text-center py-10 text-emerald-600/60 text-sm">
        <p>© <span id="year"></span> <span id="footer-name"></span>. Built with 💚 & Acrylic Style.</p>
    </footer>

    <script>
        const BLOG_CONFIG = {
            name: "林小绿",
            title: "开发者 / 摄影爱好者",
            bio: "在这里记录代码、生活以及那些充满活力的瞬间。我相信简约的设计与强大的功能可以共存。",
            avatar: "https://placehold.co/300x300/10b981/ffffff?text=Green",
            social: [
                { icon: "github", url: "https://github.com" },
                { icon: "twitter", url: "https://twitter.com" },
                { icon: "mail", url: "mailto:hello@example.com" }
            ],
            articles: [
                { 
                    id: "acrylic-web", 
                    title: "如何构建一个响应式的亚克力风格网页", 
                    date: "2024-05-10", 
                    category: "技术", 
                    excerpt: "探索 CSS Backdrop-filter 与现代 UI 设计的结合之路...",
                    content: `
                        <p>亚克力设计（Acrylic Design）是微软 Fluent Design 系统中的一种核心视觉元素，其本质是<strong>高斯模糊</strong>与<strong>半透明层</strong>的叠加。</p>
                        <h2>1. 核心属性：Backdrop-filter</h2>
                        <p>要实现这种效果，最关键的 CSS 属性是 <code>backdrop-filter: blur(20px);</code>。它能让元素背景下方的区域变模糊，而不是模糊元素自身。</p>
                        <p>为了保证可读性，我们通常会配合一个带透明度的背景色：<code>background: rgba(255, 255, 255, 0.4);</code>。</p>
                        <h2>2. 层次感与边框</h2>
                        <p>为了让“玻璃”看起来更真实，微弱的白边（模拟高光）必不可少。我们在模板中使用了 <code>border: 1px solid rgba(255, 255, 255, 0.2);</code>。</p>
                        <p>这样不仅增强了对比度，还能在深浅不同的背景色中保持清晰。这就是你现在看到的这个博客的视觉精髓。</p>
                    `
                },
                { 
                    id: "forest-breath", 
                    title: "五月：在清晨捕捉森林的呼吸", 
                    date: "2024-05-01", 
                    category: "摄影", 
                    excerpt: "这次外拍让我深刻体会到了自然光影的魅力，那一抹新绿...",
                    content: `
                        <p>清晨五点，我带上相机走进了郊外的湿地公园。那时候雾气还没散尽，阳光穿透树叶的缝隙，形成了完美的<strong>丁达尔效应</strong>。</p>
                        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" class="rounded-2xl my-6 w-full shadow-lg" alt="森林">
                        <p>我尝试用大光圈去捕捉新叶上的露水。那种由深绿到嫩黄的色彩过渡，是任何显示器都难以完美还原的自然律动。</p>
                        <p>这次外拍让我明白，好的照片不需要昂贵的器材，只需要你愿意在正确的时间出现在正确的地点。</p>
                    `
                },
                { 
                    id: "github-pages", 
                    title: "为什么 GitHub Pages 是静态博客的最佳选择", 
                    date: "2024-04-15", 
                    category: "思考", 
                    excerpt: "简单、免费、高效，让我们聊聊静态站点的优势...",
                    content: `
                        <p>对于个人开发者来说，维护一个复杂的后端数据库往往成本过高。GitHub Pages 提供了一个近乎完美的解决方案。</p>
                        <h2>为什么选择它？</h2>
                        <ul>
                            <li><strong>零成本：</strong> 完全免费托管。</li>
                            <li><strong>自动部署：</strong> 配合 Actions 可以实现自动化流程。</li>
                            <li><strong>极速访问：</strong> 通过 CDN 全球加速。</li>
                        </ul>
                        <p>通过本项目这样的单页面模板，你可以完全掌握页面的每一个像素，而无需操心服务器的运维。</p>
                    `
                }
            ],
            aboutLong: `
                <p>你好！我是一名热爱技术的创意者。我喜欢在代码的世界里寻找秩序，在自然的世界里寻找灵感。</p>
                <p>目前我专注于前端开发，特别痴迷于流畅的交互和舒适的色彩搭配。</p>
                <div class='mt-6 p-4 bg-emerald-100/50 rounded-xl border border-emerald-200'>
                    <strong>当前技能栈：</strong> HTML/CSS, Tailwind, JavaScript, React, Photography.
                </div>
            `
        };

        // 初始化内容
        function initBlog() {
            document.title = `${BLOG_CONFIG.name} 的个人主页`;
            document.getElementById('profile-name').innerHTML = `你好，我是 <span class="text-emerald-600">${BLOG_CONFIG.name}</span>`;
            document.getElementById('profile-bio').innerText = BLOG_CONFIG.bio;
            document.getElementById('profile-pic').src = BLOG_CONFIG.avatar;
            document.getElementById('footer-name').innerText = BLOG_CONFIG.name;
            document.getElementById('year').innerText = new Date().getFullYear();
            document.getElementById('about-content').innerHTML = BLOG_CONFIG.aboutLong;

            // 社交链接
            const socialContainer = document.getElementById('social-links');
            BLOG_CONFIG.social.forEach(item => {
                const link = document.createElement('a');
                link.href = item.url;
                link.className = "w-12 h-12 glass-panel rounded-full flex items-center justify-center hover:bg-emerald-500 hover:text-white transition-all hover-lift";
                link.innerHTML = `<i data-lucide="${item.icon}" class="w-5 h-5"></i>`;
                socialContainer.appendChild(link);
            });

            // 精选文章
            const featuredContainer = document.getElementById('featured-posts');
            BLOG_CONFIG.articles.slice(0, 2).forEach(post => {
                const card = document.createElement('div');
                card.className = "glass-panel p-6 rounded-3xl hover-lift cursor-pointer group";
                card.onclick = () => openArticle(post.id);
                card.innerHTML = `
                    <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest">${post.category}</span>
                    <h4 class="text-xl font-bold mt-2 mb-3 group-hover:text-emerald-600 transition-colors">${post.title}</h4>
                    <p class="text-emerald-800/60 text-sm mb-4">${post.excerpt}</p>
                    <div class="flex justify-between items-center text-xs text-emerald-800/40 font-medium">
                        <span>${post.date}</span>
                        <span class="flex items-center gap-1">阅读全文 <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
                    </div>
                `;
                featuredContainer.appendChild(card);
            });

            // 全部文章列表
            const allList = document.getElementById('all-articles-list');
            BLOG_CONFIG.articles.forEach(post => {
                const item = document.createElement('div');
                item.className = "glass-panel p-4 rounded-2xl hover:bg-white/60 transition-all cursor-pointer flex justify-between items-center";
                item.onclick = () => openArticle(post.id);
                item.innerHTML = `
                    <div>
                        <h4 class="font-semibold text-emerald-900">${post.title}</h4>
                        <p class="text-xs text-emerald-600/60">${post.date} · ${post.category}</p>
                    </div>
                    <i data-lucide="arrow-right" class="w-5 h-5 text-emerald-300"></i>
                `;
                allList.appendChild(item);
            });

            lucide.createIcons();
        }

        // 打开文章详情
        function openArticle(articleId) {
            const post = BLOG_CONFIG.articles.find(a => a.id === articleId);
            if (!post) return;

            // 填充内容
            document.getElementById('post-title').innerText = post.title;
            document.getElementById('post-meta').innerText = post.category;
            document.getElementById('post-date').innerText = `发布于 ${post.date}`;
            document.getElementById('post-content').innerHTML = post.content;

            // 切换视图
            showView('article-detail');
            lucide.createIcons();
        }

        // 切换视图逻辑
        function showView(viewId) {
            const views = document.querySelectorAll('.view-content');
            
            // 先淡出所有
            views.forEach(v => {
                v.classList.remove('active');
            });

            // 等待淡出动画完成后切换显示状态
            setTimeout(() => {
                views.forEach(v => v.style.display = 'none');
                
                const target = document.getElementById(viewId);
                target.style.display = 'block';
                
                // 触发淡入
                setTimeout(() => {
                    target.classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 50);
            }, 300);
        }

        window.onload = () => {
            initBlog();
            showView('home');
        };
    </script>
</body>
</html>
