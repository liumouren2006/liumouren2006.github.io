<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图像拆解</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #121212; color: #e0e0e0; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .canvas-container { background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; flex: 1; min-width: 300px; }
        
        canvas { border: 1px solid #333; max-width: 100%; height: auto; display: block; margin: 10px auto 0 auto; border-radius: 6px; }
        
        .transparent-bg {
            background-color: #242424;
            background-image: linear-gradient(45deg, #1c1c1c 25%, transparent 25%), 
                              linear-gradient(-45deg, #1c1c1c 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1c1c1c 75%), 
                              linear-gradient(-45deg, transparent 75%, #1c1c1c 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }

        .control-group { margin-bottom: 18px; border-bottom: 1px solid #2d2d2d; padding-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #bbb; font-size: 0.95rem; }
        .value-span { float: right; color: #00ffcc; font-family: monospace; }
        input[type="range"] { width: 100%; margin-top: 5px; accent-color: #00ffcc; cursor: pointer; }
        input[type="file"] { width: 100%; color: #aaa; }
        
        button { padding: 12px 15px; border: none; background: #00ffcc; color: #121212; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; font-size: 1rem; }
        button:hover { background: #00ccaa; box-shadow: 0 0 12px rgba(0,255,204,0.4); }
        .download-btn { background: #2d2d2d; color: #00ffcc; margin-top: 10px; border: 1px solid #3a3a3a; font-size: 0.85rem; padding: 8px 12px;}
        .download-btn:hover { background: #3a3a3a; color: #fff; }
        
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #fff; }
        .tip { font-size: 0.8rem; color: #777; margin-top: 3px; line-height: 1.3; }
        .status { color: #ffbc00; font-size: 0.9rem; margin-top: 10px; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

<h1>图像拆解</h1>
<p style="color: #888; margin-top:0; margin-bottom: 25px;">原图分辨率渲染，导出图层为主体纯白、背景透明（PNG 格式）。</p>

<div class="container">
    <div class="panel">
        <div class="control-group">
            <label>1. 上传原图</label>
            <input title="Oops" type="file" id="imageInput" accept="image/*">
            <div class="tip" id="imgInfo">图片冇加载啊（；´д｀）ゞ</div>
        </div>
        
        <div class="control-group">
            <label>2. 边缘线条加粗: <span class="value-span" id="valThick">0 px</span></label>
            <input title="标题" type="range" id="thickRange" min="0" max="12" value="0" step="0.2">
            <div class="tip">由于采用原图高清处理，可适当加大此值以加粗细小线条。</div>
        </div>

        <div class="control-group">
            <label>3. 抗锯齿平滑度: <span class="value-span" id="valBlur">1.5</span></label>
            <input title="标题" type="range" id="blurRange" min="0" max="8" value="1.5" step="0.1">
            <div class="tip">采用分离式高斯动态滤波，消除二值化带来的锯齿。</div>
        </div>
        
        <div class="control-group">
            <label>4. 丝印层阈值: <span class="value-span" id="valT1">100</span></label>
            <input title="标题" type="range" id="t1" min="0" max="255" value="100">
        </div>
        
        <div class="control-group">
            <label>5. 阻焊层阈值: <span class="value-span" id="valT2">180</span></label>
            <input title="标题" type="range" id="t2" min="0" max="255" value="180">
        </div>

        <div class="control-group" style="border:none; margin-bottom:0;">
            <label>合成预览阻焊颜色:</label>
            <input title="标题" type="color" id="midColor" value="#8c9255" style="border:none; background:none; cursor:pointer; width:60px; height:30px;">
        </div>

        <button id="processBtn">开始渲染</button>
        <div class="status" id="statusLabel"></div>
    </div>

    <div class="canvas-container" style="background: #151515;">
        <label style="color:#00ffcc;">色彩合成效果预览 (PCB正面视觉)</label>
        <canvas id="previewCanvas"></canvas>
    </div>
</div>

<h2 style="margin-top: 40px; border-top: 1px solid #2d2d2d; padding-top: 20px; color:#fff;">高清透明导出通道</h2>
<div class="container">
    <div class="canvas-container">
        <label>① 丝印层</label>
        <canvas id="silkCanvas" class="transparent-bg"></canvas>
        <button class="download-btn" onclick="downloadCanvas('silkCanvas', 'Silkscreen_Transparent.png')">导出透明丝印层</button>
    </div>
    <div class="canvas-container">
        <label>② 顶层阻焊层</label>
        <canvas id="solderCanvas" class="transparent-bg"></canvas>
        <button class="download-btn" onclick="downloadCanvas('solderCanvas', 'SolderMask_Transparent.png')">导出透明阻焊层</button>
    </div>
    <div class="canvas-container">
        <label>③ 顶层铺铜掩膜</label>
        <canvas id="topCanvas" class="transparent-bg"></canvas>
        <button class="download-btn" onclick="downloadCanvas('topCanvas', 'Top_Copper_Transparent.png')">导出透明铺铜层</button>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const t1Input = document.getElementById('t1');
    const t2Input = document.getElementById('t2');
    const thickInput = document.getElementById('thickRange');
    const blurInput = document.getElementById('blurRange');
    const midColorInput = document.getElementById('midColor');
    const processBtn = document.getElementById('processBtn');
    const statusLabel = document.getElementById('statusLabel');
    const imgInfo = document.getElementById('imgInfo');

    const previewCanvas = document.getElementById('previewCanvas');
    const silkCanvas = document.getElementById('silkCanvas');
    const solderCanvas = document.getElementById('solderCanvas');
    const topCanvas = document.getElementById('topCanvas');

    let img = new Image();

    // UI数值同步
    thickInput.oninput = () => document.getElementById('valThick').innerText = thickInput.value + " px";
    blurInput.oninput = () => document.getElementById('valBlur').innerText = parseFloat(blurInput.value).toFixed(1);
    t1Input.oninput = () => document.getElementById('valT1').innerText = t1Input.value;
    t2Input.oninput = () => {
        if (parseInt(t2Input.value) <= parseInt(t1Input.value)) t2Input.value = parseInt(t1Input.value) + 1;
        document.getElementById('valT2').innerText = t2Input.value;
    };

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        statusLabel.innerText = "正在读取图片...";
        const reader = new FileReader();
        reader.onload = (event) => {
            img.onload = () => {
                imgInfo.innerText = `分辨率: ${img.width} × ${img.height} 像素`;
                [previewCanvas, silkCanvas, solderCanvas, topCanvas].forEach(c => {
                    c.width = img.width;
                    c.height = img.height;
                });
                statusLabel.innerText = "图片加载完成，请点击渲染。";
                executeProcessing();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    processBtn.addEventListener('click', () => {
        if (!img.src) {
            statusLabel.innerText = "你图呢?不给图我处理什么?";
            return;
        }
        statusLabel.innerText = "我计算...";
        // 使用 setTimeout 释出主线程
        setTimeout(executeProcessing, 50);
    });

    function hexToRgb(hex) {
        const bigint = parseInt(hex.slice(1), 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function executeProcessing() {
        const w = img.width;
        const h = img.height;
        
        // 利用离屏画布提取原始像素
        const offscreen = document.createElement('canvas');
        offscreen.width = w;
        offscreen.height = h;
        const oCtx = offscreen.getContext('2d');
        oCtx.drawImage(img, 0, 0, w, h);
        const srcData = oCtx.getImageData(0, 0, w, h).data;

        const t1 = parseInt(t1Input.value);
        const t2 = parseInt(t2Input.value);
        const thickRadius = parseInt(thickInput.value);
        const blurRadius = parseFloat(blurInput.value);
        const midRgb = hexToRgb(midColorInput.value);

        // 1. 提取亮度
        let grayGrid = new Float32Array(w * h);
        for (let i = 0; i < srcData.length; i += 4) {
            if (srcData[i+3] < 30) {
                grayGrid[i/4] = 255; // 透明背景归为白调
            } else {
                grayGrid[i/4] = 0.299 * srcData[i] + 0.587 * srcData[i+1] + 0.114 * srcData[i+2];
            }
        }

        // 2. 高阶抗锯齿：执行双通道高斯模糊卷积
        if (blurRadius > 0) {
            grayGrid = gaussianBlurSeparable(grayGrid, w, h, blurRadius);
        }

        // 3. 像素分发与掩膜数据构建
        const pCtx = previewCanvas.getContext('2d');
        const silkCtx = silkCanvas.getContext('2d');
        const solderCtx = solderCanvas.getContext('2d');
        const topCtx = topCanvas.getContext('2d');

        const outPreview = pCtx.createImageData(w, h);
        const outSilk = silkCtx.createImageData(w, h);
        const outSolder = solderCtx.createImageData(w, h);
        const outTop = topCtx.createImageData(w, h);

        const dataP = outPreview.data;
        const dataSilk = outSilk.data;
        const dataSolder = outSolder.data;
        const dataTop = outTop.data;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = y * w + x;
                const pixIdx = idx * 4;
                
                let luma = grayGrid[idx];

                // 边缘向外暗化
                if (thickRadius > 0 && luma >= t1) {
                    let minLuma = luma;
                    for (let dy = -thickRadius; dy <= thickRadius; dy++) {
                        for (let dx = -thickRadius; dx <= thickRadius; dx++) {
                            if (dx*dx + dy*dy > thickRadius*thickRadius) continue;
                            let nx = x + dx;
                            let ny = y + dy;
                            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                                let nLuma = grayGrid[ny * w + nx];
                                if (nLuma < minLuma) minLuma = nLuma;
                            }
                        }
                    }
                    luma = minLuma;
                }

                // 分层渲染与透明通道控制
                if (luma < t1) {
                    // 丝印层：合成图显黑色；导出图显纯白主体+不透明
                    setPixel(dataP, pixIdx, 0, 0, 0, 255);
                    setPixel(dataSilk, pixIdx, 255, 255, 255, 255); // 白色主体
                    setPixel(dataSolder, pixIdx, 0, 0, 0, 0);       // 透明背景
                    setPixel(dataTop, pixIdx, 0, 0, 0, 0);          // 透明背景
                } else if (luma >= t1 && luma < t2) {
                    // 阻焊层：合成图显绿/褐色；导出图显纯白主体+不透明
                    setPixel(dataP, pixIdx, midRgb.r, midRgb.g, midRgb.b, 255);
                    setPixel(dataSilk, pixIdx, 0, 0, 0, 0);
                    setPixel(dataSolder, pixIdx, 255, 255, 255, 255);
                    setPixel(dataTop, pixIdx, 0, 0, 0, 0);
                } else {
                    // 铺铜/顶层：合成图显白色；导出图显纯白主体+不透明
                    setPixel(dataP, pixIdx, 255, 255, 255, 255);
                    setPixel(dataSilk, pixIdx, 0, 0, 0, 0);
                    setPixel(dataSolder, pixIdx, 0, 0, 0, 0);
                    setPixel(dataTop, pixIdx, 255, 255, 255, 255);
                }
            }
        }

        // 写回数据
        pCtx.putImageData(outPreview, 0, 0);
        silkCtx.putImageData(outSilk, 0, 0);
        solderCtx.putImageData(outSolder, 0, 0);
        topCtx.putImageData(outTop, 0, 0);

        statusLabel.innerText = "完事儿";
    }

    function setPixel(arr, i, r, g, b, a) {
        arr[i] = r; arr[i+1] = g; arr[i+2] = b; arr[i+3] = a;
    }

    // 高效双通道分离式高斯模糊算法 O(N) 
    function gaussianBlurSeparable(src, w, h, radius) {
        let target = new Float32Array(w * h);
        let temp = new Float32Array(w * h);
        let weights = [];
        let rs = Math.ceil(radius * 2.57);
        let wsum = 0;
        
        for (let i = -rs; i <= rs; i++) {
            let wgt = Math.exp(-(i * i) / (2 * radius * radius));
            weights.push(wgt);
            wsum += wgt;
        }
        for (let i = 0; i < weights.length; i++) weights[i] /= wsum;

        // 横向模糊通道
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let val = 0;
                for (let ix = -rs; ix <= rs; ix++) {
                    let nx = Math.min(w - 1, Math.max(0, x + ix));
                    val += src[y * w + nx] * weights[ix + rs];
                }
                temp[y * w + x] = val;
            }
        }
        // 纵向模糊通道
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let val = 0;
                for (let iy = -rs; iy <= rs; iy++) {
                    let ny = Math.min(h - 1, Math.max(0, y + iy));
                    val += temp[ny * w + x] * weights[iy + rs];
                }
                target[y * w + x] = val;
            }
        }
        return target;
    }

    function downloadCanvas(canvasId, filename) {
        const canvas = document.getElementById(canvasId);
        if(canvas.width === 0) {
            alert("求你先上传图片把QAQ");
            return;
        }
        const link = document.createElement('a');
        link.download = filename;
        // 基于 canvas 原生尺寸导出 1:1 含有透明通道的 PNG 图像
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
